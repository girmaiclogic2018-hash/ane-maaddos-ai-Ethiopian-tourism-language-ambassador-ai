<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="45%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>

    <!-- Golden Imperial Ethiopian Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Emerald Highlands Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Crimson Heritage Glow -->
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Inner Subtle Border -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Radiant Background Aura Rings (Soundwave / Spoken Voice Communication) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#rubyGrad)" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- Acoustic Voice Waveform Arcs (Left and Right) -->
  <g stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 120 200 A 70 70 0 0 0 120 312" />
    <path d="M 90 170 A 110 110 0 0 0 90 342" stroke-width="5" opacity="0.6" />
    <path d="M 62 140 A 150 150 0 0 0 62 372" stroke-width="4" opacity="0.4" />
  </g>

  <g stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 392 200 A 70 70 0 0 1 392 312" />
    <path d="M 422 170 A 110 110 0 0 1 422 342" stroke-width="5" opacity="0.6" />
    <path d="M 450 140 A 150 150 0 0 1 450 372" stroke-width="4" opacity="0.4" />
  </g>

  <!-- Central Monumental Monolithic Motif (Aksum Obelisk + Lalibela Cruciform Geometry) -->
  <g filter="url(#goldGlow)">
    <!-- Vertical Spire / Obelisk Pillar -->
    <path d="M 236 100 L 276 100 L 284 390 L 228 390 Z" fill="url(#goldGrad)" />

    <!-- Obelisk Window Registers / Bas-relief carvings -->
    <rect x="246" y="140" width="20" height="28" rx="4" fill="#0C0A09" />
    <rect x="246" y="184" width="20" height="28" rx="4" fill="#0C0A09" />
    <rect x="246" y="228" width="20" height="28" rx="4" fill="#0C0A09" />
    <rect x="246" y="272" width="20" height="28" rx="4" fill="#0C0A09" />
    <rect x="244" y="324" width="24" height="42" rx="4" fill="#0C0A09" />
    <!-- False Door Base Carving -->
    <rect x="248" y="342" width="16" height="24" rx="2" fill="url(#goldGrad)" />

    <!-- Lalibela Cruciform Cross Arms (Horizontal Traverse) -->
    <path d="M 160 236 L 352 236 L 352 276 L 160 276 Z" fill="url(#goldGrad)" />
    <!-- Cruciform Cross End Notches -->
    <polygon points="160,224 136,256 160,288" fill="url(#goldGrad)" />
    <polygon points="352,224 376,256 352,288" fill="url(#goldGrad)" />

    <!-- Obelisk Apex Crown Arch -->
    <path d="M 236 100 Q 256 64 276 100 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Central Star of Guidance / AI Ambassador Spark -->
  <g transform="translate(256, 256)">
    <!-- Radiant Diamond Core -->
    <polygon points="0,-36 26,-10 36,0 26,10 0,36 -26,10 -36,0 -26,-10" fill="url(#emeraldGrad)" stroke="#FFFFFF" stroke-width="2" />
    <!-- Center Glowing Dot -->
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>

  <!-- Ge'ez / Horn Heritage Star Accents (Top & Bottom Markers) -->
  <circle cx="256" cy="60" r="6" fill="#F59E0B" />
  <circle cx="256" cy="452" r="6" fill="#10B981" />
  <circle cx="60" cy="256" r="6" fill="#EF4444" />
  <circle cx="452" cy="256" r="6" fill="#F59E0B" />
</svg>
